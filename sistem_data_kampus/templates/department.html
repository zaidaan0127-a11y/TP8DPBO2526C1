<h4>Data Departemen</h4>
{{ALERT}}
<!-- Form tambah / ubah (id terisi saat mode edit) -->
<div class="card mb-4"><div class="card-body">
  <form method="post" action="department.php">
    <input type="hidden" name="id" value="{{ID}}">
    <div class="form-group">
      <label>Nama Departemen</label>
      <input class="form-control" name="name" value="{{NAME}}" required>
    </div>
    <button class="btn btn-primary">{{BTN}}</button> {{CANCEL}}
  </form>
</div></div>
<!-- Tabel data -->
<table class="table table-striped table-bordered">
  <thead class="thead-light"><tr><th>No</th><th>Nama</th><th>Aksi</th></tr></thead>
  <tbody>{{ROWS}}</tbody>
</table>
