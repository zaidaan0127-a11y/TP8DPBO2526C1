<h4>Data Dosen</h4>
{{ALERT}}
<!-- Form tambah / ubah (id terisi saat mode edit) -->
<div class="card mb-4"><div class="card-body">
  <form method="post" action="index.php">
    <input type="hidden" name="id" value="{{ID}}">
    <div class="form-row">
      <div class="form-group col-md-6"><label>Nama</label>
        <input class="form-control" name="name" value="{{NAME}}" required></div>
      <div class="form-group col-md-6"><label>NIDN</label>
        <input class="form-control" name="nidn" value="{{NIDN}}"></div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-6"><label>Email</label>
        <input type="email" class="form-control" name="email" value="{{EMAIL}}"></div>
      <div class="form-group col-md-6"><label>No. HP</label>
        <input class="form-control" name="phone" value="{{PHONE}}"></div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-6"><label>Tanggal Bergabung</label>
        <input type="date" class="form-control" name="join_date" value="{{JOIN_DATE}}"></div>
      <div class="form-group col-md-6"><label>Departemen</label>
        <select class="form-control" name="department_id">{{DEPT_OPT}}</select></div>
    </div>
    <button class="btn btn-primary">{{BTN}}</button> {{CANCEL}}
  </form>
</div></div>
<!-- Tabel data -->
<div class="table-responsive">
<table class="table table-striped table-bordered">
  <thead class="thead-light"><tr><th>No</th><th>Nama</th><th>NIDN</th><th>Email</th><th>HP</th><th>Bergabung</th><th>Departemen</th><th>Aksi</th></tr></thead>
  <tbody>{{ROWS}}</tbody>
</table>
</div>
